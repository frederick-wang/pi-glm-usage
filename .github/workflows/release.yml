name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify tarball file list (gate)
        run: node scripts/check-pack.mjs
      - name: Publish with provenance
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Report missing NPM_TOKEN
        if: ${{ env.NPM_TOKEN == '' }}
        run: |
          echo "::error::NPM_TOKEN secret is not configured. Add it to repository secrets, then re-run this workflow from the tag."
          exit 1
